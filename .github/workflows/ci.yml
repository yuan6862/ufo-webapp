name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model & show accuracy
        run: python train_model.py

      - name: Check backend syntax
        run: python -m py_compile backend.py && echo "backend.py OK"

      - name: Check frontend syntax
        run: python -m py_compile frontend.py && echo "frontend.py OK"

      - name: Start backend and health check
        run: |
          uvicorn backend:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/ | python -m json.tool
          kill %1

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images and start the stack
        run: docker compose up -d --build

      - name: Wait for backend, then health check
        run: |
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/ >/dev/null && break
            sleep 3
          done
          curl -f http://localhost:8000/ | python3 -m json.tool

      - name: Wait for frontend, then health check
        run: |
          for i in $(seq 1 20); do
            curl -fs http://localhost:8501/_stcore/health >/dev/null && break
            sleep 3
          done
          curl -f http://localhost:8501/_stcore/health

      - name: Show logs on success
        if: always()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down
